<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembaruan Data - BUMDesa Mappakengka Buana Paselloreng</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --primary-green: #0b2e26;
            --eco-medium: #1e5128;
            --eco-light: #4e944f;
            --accent-lime: #b4ff9f;
            --glass-bg: rgba(255, 255, 255, 0.8); 
            --glass-border: rgba(255, 255, 255, 0.9);
            --text-main: #0b2e26;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Sora', sans-serif; }

        body {
            background: 
                linear-gradient(rgba(244, 252, 244, 0.85), rgba(244, 252, 244, 0.85)),
                url('https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Latar belakang animasi blob */
        .bg-blobs { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }
        .blob { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.2; animation: float 20s infinite alternate ease-in-out; }
        .blob-1 { width: 400px; height: 400px; background: var(--eco-light); top: -10%; left: -5%; }
        .blob-2 { width: 350px; height: 350px; background: var(--accent-lime); bottom: 10%; right: 5%; }

        @keyframes float { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }

        .maintenance-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 50px 30px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(11, 46, 38, 0.1);
            position: relative;
        }

        .icon-box {
            font-size: 4rem;
            color: var(--eco-light);
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        /* Animasi Gear Berputar */
        .fa-cog {
            animation: spin 4s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        h1 {
            color: var(--primary-green);
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        p {
            color: #555;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary-green);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 15px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(11, 46, 38, 0.2);
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(11, 46, 38, 0.3);
            background: var(--eco-medium);
        }

        .loader-bar {
            width: 100%;
            height: 4px;
            background: rgba(11, 46, 38, 0.1);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .loader-progress {
            width: 45%;
            height: 100%;
            background: linear-gradient(90deg, var(--eco-light), var(--accent-lime));
            animation: progress 2s infinite ease-in-out;
        }

        @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="maintenance-card animate__animated animate__zoomIn">
        <div class="icon-box">
            <i class="fas fa-cog"></i>
            <i class="fas fa-tools" style="font-size: 1.5rem; position: absolute; bottom: 0; right: -5px; color: var(--primary-green);"></i>
        </div>

        <h1>Sedang Memperbarui Data</h1>
        <p>Mohon maaf atas ketidaknyamanannya. Saat ini kami sedang melakukan pemeliharaan sistem atau pembaruan informasi untuk memberikan pelayanan yang lebih baik.</p>
        
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>

        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Kembali ke Beranda
        </a>
    </div>

</body>
</html>
